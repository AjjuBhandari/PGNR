services:
  - type: web
    name: mc-bot-dashboard
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MOCK_MODE
        value: "false"
      - key: DEFAULT_MC_VERSION
        value: "1.20.4"
      - key: MC_AUTH_MODE
        value: offline
      - key: MC_TARGET_SERVER
        value: ""
      - key: FRONTEND_URL
        value: "https://mc-bot-dashboard.onrender.com/"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BOT_ENCRYPTION_KEY
        generateValue: true
      - key: DEFAULT_MC_HOST
        sync: false
      - key: OPENAI_API_KEY
        sync: false
