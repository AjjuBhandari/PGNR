services:
  server:
    build: ./server
    container_name: mc-bot-server
    ports:
      - "4000:4000"
    env_file:
      - ./server/.env
    volumes:
      - bot-data:/app/data.sqlite
    restart: unless-stopped

  client:
    build: ./client
    container_name: mc-bot-client
    ports:
      - "5173:80"
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:4000/api
        VITE_WS_URL: http://localhost:4000
    depends_on:
      - server
    restart: unless-stopped

volumes:
  bot-data:
